name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :common:test
      - run: ./gradlew :neoforge:runData
      - run: ./gradlew :neoforge:test :neoforge:build
      - run: git diff --exit-code -- neoforge/src/generated/resources
      - run: test -z "$(git status --porcelain --untracked-files=all -- neoforge/src/generated/resources)"
      - run: ./gradlew :neoforge:runGameTestServer
      - run: python3 tools/generate_icons.py
      - run: git diff --exit-code -- common/src/main/resources/assets/create_mekanism_zinc/textures/item
      - run: test -z "$(git status --porcelain --untracked-files=all -- common/src/main/resources/assets/create_mekanism_zinc/textures/item)"
      - uses: actions/upload-artifact@v4
        with:
          name: create-mekanism-zinc-jar
          path: neoforge/build/libs/create-mekanism-zinc-0.2.3-dev.jar
          if-no-files-found: error
