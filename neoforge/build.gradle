plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'create-mekanism-zinc'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def metadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            create_version_range: create_version_range,
            mekanism_version_range: mekanism_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
    ]
    inputs.properties props
    filteringCharset = 'UTF-8'
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir(metadata)

neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = rootProject.file('.local/client')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = rootProject.file('.local/server')
        }
        data {
            data()
            gameDirectory = rootProject.file('.local/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = rootProject.file('.local/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':common')
    compileOnly "maven.modrinth:create:${create_version}"
    compileOnly "maven.modrinth:mekanism:${mekanism_version}"
    localRuntime "maven.modrinth:create:${create_version}"
    localRuntime "maven.modrinth:mekanism:${mekanism_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from project(':common').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('check').configure {
    dependsOn project(':common').tasks.named('checkCommonBoundary')
}

neoForge.ideSyncTask metadata
